# Case deck: random trials for the Draw button (see the Дела tab).
# Used ids persist in data/memory.json; POST /api/cases/reset reshuffles.
# details = full brief shown before the trial and fed to the judge.
# defense_example = a starter line for the streamer, improv follows.
cases:
  - id: "party-sub-heist"
    title: "Бутербродный Левиафан"
    crime: "Подсудимый в одиночку сожрал метровый сэндвич, купленный вскладчину на восьмерых."
    context: "Гости скинулись по $15 на гигантский сэндвич к матчу. Подсудимый съел свою порцию, а через полтора часа доел и остаток. К перерыву гости нашли пустой лоток с петрушкой и лужицей майонеза."
    details: |
      Обстоятельства: компания из 8 друзей скинулась на 180-сантиметровый сэндвич. Подсудимый съел законные 20 см, заметил, что к столу никто не подходит, и методично доел оставшийся метр с лишним.
      Улики: пустой лоток со следами зубов; чек на $120 с подписями всех участников; заключение гастроэнтеролога об аномальной эластичности желудка.
      Дилемма: эгоизм и обжорство против пищевой безопасности — еда лежала в тепле без присмотра, гости сами виноваты, что не ели вовремя.
    defense_example: |
      ПРИМЕР (дальше импровизация): доктрина СанПиН — майонез в тепле через 2 часа становится биоугрозой, подзащитный спасал товарищей от сальмонеллёза. Плюс приобретательная давность: брошенное на 45+ минут угощение юридически бесхозно.
    tags: ["food", "roommate", "aita", "biohazard"]
    weight: 3
    source: "reddit"
  - id: "carolina-reaper-lunch"
    title: "Капсаициновый капкан"
    crime: "Заминировал свой ланчбокс соусом Carolina Reaper, отправив коллегу-вора на скорую."
    context: "В опенспейсе завёлся вор чужих обедов. Потерпевший (тимлид) украл ланчбокс с пометкой «НЕ ТРОГАТЬ», съел три ложки пасты с экстрактом перца на 2.2 млн сковиллей и уехал с ожогом гортани. Требует $5000."
    details: |
      Обстоятельства: обвиняемый приготовил невинную с виду пасту болоньезе с экстрактом Carolina Reaper. Потерпевший тайно украл контейнер, после трёх ложек выпил всё молоко из кулера и уехал на скорой.
      Улики: ланчбокс с надписью «ОБЕД ИГОРЯ. НЕ ТРОГАТЬ, ОПАСНО ДЛЯ ЖИЗНИ»; флакон соуса с черепом; запись камеры, где потерпевший прячет чужой контейнер под пиджак.
      Дилемма: вор получил мгновенную карму, но минирование еды наказуемо. Где граница между вкусовыми предпочтениями и ловушкой?
    defense_example: |
      ПРИМЕР (дальше импровизация): право на вкусовые предпочтения — для подзащитного этот перец как лёгкая корица. Плюс самооборона имущества: грабитель, порезавшийся о разбитое им же окно, не судит хозяина за стеклопакет.
    tags: ["workplace", "revenge", "food", "karma"]
    weight: 3
    source: "reddit"
  - id: "wedding-sd-purge"
    title: "Форматирование свадьбы"
    crime: "Свадебный фотограф стёр 3000 кадров прямо перед молодоженами, когда ему отказали в воде и еде."
    context: "10 часов съёмки в +34°C без капли воды. На восьмом часу фотограф попросил 20 минут перерыва, жених ответил «ты обслуга, а не гость». Фотограф нажал FORMAT SD CARD → YES и ушёл. Невеста в слезах."
    details: |
      Обстоятельства: пара наняла начинающего фотографа за бесценок. После отказа в воде и еде фотограф при женихе отформатировал карту на 128 ГБ и ушёл. Свадьба осталась без единого снимка, жених подал иск на $10 000.
      Улики: пустая карта памяти; помятый договор на салфетке «работать до победного» без пункта о воде; выписка из бара — фотографу за 8 часов не налили даже воды.
      Дилемма: уничтожение незаменимых кадров жестоко, но отношение молодожёнов граничило с рабским трудом.
    defense_example: |
      ПРИМЕР (дальше импровизация): лишение воды в +34°C восемь часов — пытка, подзащитный был в физиологическом аффекте. Плюс «снимай или убирайся без оплаты» — односторонний отказ заказчика, неоплаченные файлы принадлежат автору.
    tags: ["wedding", "contract", "revenge", "drama"]
    weight: 2
    source: "reddit"
  - id: "klepto-cat-syndicate"
    title: "Синдикат шерстяного домушника"
    crime: "Кот обвиняемого украл у соседей гору белья, а хозяин выставил добычу в коробке у калитки."
    context: "Кот ночами лазил по соседским верандам и таскал бельё: десятки лифчиков, носков и плавок. Хозяин складывал всё в коробку «Бюро находок кота». Соседи подали коллективный иск."
    details: |
      Обстоятельства: GPS-ошейник зафиксировал визиты кота в 14 домов. В зале суда вывалены 42 лифчика, 67 непарных носков и 15 пар плавок. Соседи обвиняют хозяина в фетишизме и дрессировке вора.
      Улики: коробка добычи с табличкой; GPS-трек; запись домофона, где кот перепрыгивает забор с бельём в зубах.
      Дилемма: хозяин сам ничего не крал и выставил вещи для возврата, но попустительствовал налётам, нарушая приватность соседей.
    defense_example: |
      ПРИМЕР (дальше импровизация): у кота нет правосубъектности — в кошачьем кодексе нет частной собственности, он носил дары стае. Фетишист не выставил бы добычу на улицу с надписью «Забирайте».
    tags: ["animals", "real_life", "absurd", "neighborhood"]
    weight: 2
    source: "real_life"
  - id: "sleep-stream-havoc"
    title: "Акустический штурм спальни"
    crime: "Донатом в 50 рублей включил сирену на колонке спящего стримера и заказал 15 мешков наполнителя."
    context: "Стример вёл сонный марафон с включённой умной колонкой. В 04:15 колонка на полную включила сирену, открыла шторы и оформила заказ. Стример упал с кровати, снёс веб-камеру и вызвал полицию. Требует бан и $1500."
    details: |
      Обстоятельства: зритель прислал донат с голосовой командой для колонки. В спальне включились стробоскоп и сирена, стример спросонья запутался в одеяле, рухнул на пол и в панике вызвал полицию.
      Улики: клип, где стример борется с одеялом под сирену; лог доната с текстом команды; разбитая веб-камера со вмятиной.
      Дилемма: ущерб реален, но стример сам оставил незащищённый голосовой интерфейс на публичном стриме за деньги.
    defense_example: |
      ПРИМЕР (дальше импровизация): white-hat аудит — демонстрация уязвимости нулевого дня. Плюс публичная оферта: взял 50 рублей за озвучку — договор заключён, на громкость не жалуйся.
    tags: ["twitch", "sleepstream", "tts", "smarthome"]
    weight: 1
    source: "twitch"
  - id: "art-room-bromance"
    title: "Арт-будуар платонической страсти"
    crime: "Втайне от жены за $4200 переделал свободную комнату в звукоизолированную арт-студию для своего лучшего друга Бена."
    context: "Пара два года спорила о назначении комнаты. Муж сблизился с коллегой Беном и проникся к нему «неземной связью». На день рождения друга он без спроса начал монтировать звукоизоляцию и мольберт. Жена подала на развод, реддит сделал историю мемом об эмоциональной измене."
    details: |
      Обстоятельства: подсудимый потратил семейный бюджет на арт-студию для друга Бена, уверяя жену, что это «чисто мужской жест». После бури на Reddit муж признался другу в чувствах, назвал этот вечер лучшим в жизни и объявил о разводе.
      Улики: банка лавандовой краски с отпечатками подсудимого; чек на $4200 за звукоизоляцию; распечатка треда со статусом YTA; семейное фото со стикером «БЕН».
      Дилемма: растрата семейных денег и предательство очага против запоздалого раскрытия ориентации без физической измены.
    defense_example: |
      ПРИМЕР (дальше импровизация): доктрина урбанистической ревитализации — комната пустовала два года, студия подняла оценку дома. Плюс презумпция броманса: закон не запрещает мужчинам восхищаться натюрмортами друг друга!
    tags: ["marriage", "aita", "bromance", "artroom", "divorce"]
    weight: 3
    source: "reddit"
  - id: "group-project-faked-death"
    title: "Некролог третьей степени"
    crime: "Инсценировал свою смерть через некролог в газете за $45, чтобы не делать тяжёлый групповой проект по сетям."
    context: "Перед дедлайном студент прислал напарнику ссылку на газетный некролог со своим фото. Напарник двое суток не спал, сдал проект под минуту молчания профессора. Через неделю «покойника» встретили живым в фастфуде."
    details: |
      Обстоятельства: не желая разбираться в сетевых протоколах, студент купил поминальную заметку в газете. Напарник пережил нервный срыв, в одиночку поднял архитектуру на троих и получил высший балл. Обман вскрылся за обедом в Chipotle.
      Улики: вырезка из газеты со скорбным некрологом; чек на $45 за публикацию; чек из фастфуда, пробитый во время университетской минуты молчания; слайд презентации с чёрной лентой.
      Дилемма: жесткий цинизм против бунта против несправедливой системы групповых заданий.
    defense_example: |
      ПРИМЕР (дальше импровизация): доктрина академической реинкарнации — подзащитный духовно умер как сисадмин и воскрес философом. Плюс эффект плацебо: только скорбь помогла потерпевшему собраться и сдать проект на максимум!
    tags: ["college", "groupproject", "fake_death", "sabotage", "absurd"]
    weight: 3
    source: "reddit"
  - id: "the-poop-knife-conspiracy"
    title: "Клинок сантехнического возмездия"
    crime: "Держал в квартире фамильный нож для заторов, которым жена три года вскрывала посылки и резала яблоки на праздничный пирог."
    context: "Парень вырос в семье, где на гвозде всегда висел нож для унитаза. До 22 лет считал это нормой, пока не спросил нож на чужой вечеринке. В браке повесил нож в подсобку, а жена случайно узнала, чем чистила фрукты."
    details: |
      Обстоятельства: вирусная исповедь с Reddit о туалетном тесаке. Подсудимый шокировал друзей на вечеринке вопросом о ноже, а спустя годы шокировал жену, которая использовала инструмент для распаковки посылок и готовки.
      Улики: тупой тесак с деревянной ручкой; посылка со следами надреза; форма для пирога; запись крика жены.
      Дилемма: забота о проходимости труб против многолетней антисанитарии на собственной кухне.
    defense_example: |
      ПРИМЕР (дальше импровизация): экологическая доктрина спасения ЖКХ — клиент защищал городские стоки от засоров. А шарлотка выпекалась при 200 градусах, что даёт полную дезинфекцию!
    tags: ["confessions", "poopknife", "family_tradition", "biohazard", "legendary"]
    weight: 3
    source: "reddit"
  - id: "bluetooth-bagpipe-siege"
    title: "Блютуз-волынки судного дня"
    crime: "Перехватил открытый Bluetooth ночного меломана, включив демонический шёпот и волынки, из-за чего тот в панике выкинул колонку из окна на чужую машину."
    context: "Сосед снизу ночами терроризировал дом громкой музыкой. Инженер нашёл открытый Bluetooth без пароля и в 03:45 врубил похоронные волынки с синтезированным голосом. Сосед вызвал экзорциста и сбросил колонку с 8 этажа на автомобиль председателя ТСЖ."
    details: |
      Обстоятельства: партизанская радио-война с ночным тусовщиком. Хакер транслировал в колонку кельтские марши, звуки козлов и замедленный Рикролл. Потерпевший решил, что техника одержима, и сбросил её из окна.
      Улики: плейлист со смартфона; останки колонки на капоте председателя; чек за визит экзорциста на $200; скриншот названий Wi-Fi сетей.
      Дилемма: самооборона жильцов против доведения соседа до паранойи и порчи чужого авто.
    defense_example: |
      ПРИМЕР (дальше импровизация): доктрина публичной оферты протокола Bluetooth — открытый эфир равен согласию на входящий сигнал. Плюс миссия ЮНЕСКО: раз сосед не понимает по-русски, с ним заговорила гордая Шотландия!
    tags: ["neighbors", "pettyrevenge", "bluetooth", "hacker", "bagpipes"]
    weight: 2
    source: "reddit"
  - id: "dog-identity-theft"
    title: "Дело о понижении в собачьем звании"
    crime: "Отказалась сменить кличку 4-летнему ретриверу Чарли после того, как сестра назвала новорождённого сына тем же именем."
    context: "Девушка 4 года воспитывает золотистого ретривера Чарли. Сестра родила первенца, тоже назвала Чарли и потребовала переименовать или сдать собаку. Родня встала на сторону сестры и лишила хозяйку доли в даче."
    details: |
      Обстоятельства: битва за авторские права на имя. Сестра знала кличку собаки до беременности, но после родов потребовала переименовать пса в Бобика. Владелица отказалась ломать психику животному.
      Улики: ветпаспорт ретривера 4-летней давности; свидетельство о рождении двухнедельной давности; видео, где пёс съедает детское пюре по зову бабушки; угрозы лишения наследства в чате.
      Дилемма: семейный приоритет младенца против прав питомца на привычную идентичность.
    defense_example: |
      ПРИМЕР (дальше импровизация): патентный приоритет — пёс зарегистрирован на 4 года раньше ребёнка, младенец — контрафактный тёзка. Плюс опыт Британии: монархи делили имя со спаниелями веками без ущерба!
    tags: ["family_drama", "pets", "aita", "goldenretriever", "entitled"]
    weight: 2
    source: "reddit"
