name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: go vet ./...
      - run: make package-win
      - run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/StreamTribunal-windows-amd64.zip --clobber
          else
            gh release create "${{ github.ref_name }}" dist/StreamTribunal-windows-amd64.zip --title "${{ github.ref_name }}" --notes "One-click Windows build: unzip, run StreamTribunal.exe, open http://localhost:7890"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
