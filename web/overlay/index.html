<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Stream Tribunal Overlay</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="stage">
    <div id="court" class="hidden">
      <img id="court-bg" src="/api/court/photo" alt="" aria-hidden="true">
      <div id="prosecutor">
        <div id="bust">
          <div id="hair"></div>
          <div id="face">
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div id="mouth"></div>
          </div>
          <div id="suit"></div>
          <div id="arm"></div>
        </div>
      </div>

      <div id="docket">
        <div id="case-no">ДЕЛО №404</div>
        <div id="charge">Зал суда готов</div>
        <div id="subtitles" aria-live="off"></div>
      </div>

      <div id="testimony" class="hidden">
        <div id="testimony-author">Подсудимый</div>
        <div id="testimony-text"></div>
      </div>

    </div>

    <div id="objection" class="hidden objection-burst">ПРОТЕСТУЮ!</div>
    <div id="verdict" class="hidden"><span id="verdict-text">ВИНОВЕН</span></div>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
