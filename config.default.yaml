server:
  host: "127.0.0.1"
  port: 3236
  secret: ""

ai:
  provider: "groq" # groq, cerebras, ollama or any label with base_url (custom routers)
  api_key: ""
  model: "llama-3.3-70b-versatile"
  temperature: 0.85
  stream: true
  base_url: "" # e.g. https://llm.onerouter.pro/v1 — wins over provider presets
  extra_body: {} # router params merged into the request root, e.g. {provider: {service_tier: standard}}

tts:
  delivery: "natural"
  roles: {}
  eleven_api_key: ""
  eleven_voice_id: ""
  eleven_model_id: "eleven_multilingual_v2"
  enabled: true
  engine: "edge"
  voice: "ru-RU-SvetlanaNeural"
  rate: "+0%"
  volume: "+0%"
  pitch: "+0Hz"
  auto_fallback: true
  judge_voice: "ru-RU-SvetlanaNeural"
  judge_rate: "-10%"
  silero_url: "http://127.0.0.1:7892"
  silero_judge: "kseniya"
  piper_binary: ""
  model_path: "models/ru_irina.onnx"
  config_path: "models/ru_irina.onnx.json"
  speaker_id: 0
  speed: 1.15

appearance:
  theme: "walnut"
  judge_preset: "" # Preserve an existing custom portrait, otherwise use the original.
  show_judge: true
  reduce_motion: false

courtroom:
  queue_open: true # accept voluntary entries from !court and paid entries
  theme: "ace_attorney"
  judge_name: "Судья"
  judge_style: "strict"
  defense_sec: 20
  testimony_sec: 25
  sue_threshold: 5
  sue_window_sec: 600
  streamer_chance: 0.1 # draw flips to a streamer trial with this probability; 0 = off
  crime_enabled: false # !crime lets viewers invent their own case via AI
  # articles: charge templates, shown as chips in the cockpit and modes.
  articles: []
  # punishments: penalty deck for guilty non-viewers, drawn at random.
  punishments: []
  # spoken templates below: empty = that line stays silent.
  standby_indictment: "Суд разбирает бумаги. Заседание продолжается!"
  standby_deliberation: "Суд удаляется на совещание."
  standby_objection: "Протест принят. Суд продолжает!"
  silent_defense: "" # used as defense when the streamer says nothing
  witness_intro: "" # e.g. "Суд приобщает показания свидетелей."
  witness_outro: "" # e.g. "Показания приобщены к делу!"
  empty_testimony: "" # deliberation context when nobody said a word
  bribe_twist: "" # appended to the verdict when a bribe flips it
  undecided_twist: "" # appended when the model gives no verdict
  # line templates below use {placeholders}; empty = that line stays silent
  witness_line: "" # e.g. "Свидетель {donor} вносит {amount} {currency} и заявляет: {message}"
  testimony_prefix: "" # e.g. "Подсудимый: "
  defense_prefix: "" # e.g. "Защита: "
  snitch_prefix: "" # e.g. "Доносы зала: "
  penalty_timeout: "" # e.g. "одиночная камера: мут на {secs} секунд"
  penalty_pardon: "" # e.g. "помилован лично стримером"
  penalty_ban: "" # e.g. "изгнан из чата навсегда"
  penalty_prefix: "" # e.g. "Наказание суда: "
  cases_file: "cases.yaml"
  cases_gen:
    enabled: true # background top-up + sync fallback when the deck runs dry
    batch: 5
    low_mark: 3 # refill when fewer remain unplayed

donations:
  witness_enabled: true # attach regular donation messages to the current case
  rule_currency: "RUB" # currency of queue_min, bribe_min and automatic-trial thresholds
  queue_min: 0 # priority entry via donation message !court twitch_login; 0 = disabled
  token: ""
  default_min: 100
  platinum_min: 500
  streamer_trial_min: 0
  bribe_min: 0 # donations at/above this look like bribes even with no hint words; 0 = only words count
  min_amounts:
    RUB: 100
    USD: 2
    EUR: 2
    BITS: 200
  donationalerts:
    enabled: true
    token: "" # canonical widget token; donations.token is a legacy alias
  donatepay:
    enabled: true
    api_key: ""
  twitch_bits:
    enabled: true

safety:
  filter_enabled: true
  custom_blacklist: []
  panic_hotkey: "f12"
  ban_confirm: true # never auto-ban on verdict, streamer bans by hand
  bribe_words: [] # e.g. ["взятк"]: donor money that sways the judge; empty = bribes off

game:
  streamer_name: "Стример"
  memory_path: "data/memory.json"
  donate_token: ""

twitch:
  channel: ""
  nick: "tribunal_bot"
  token: ""
  client_id: ""
  broadcaster_id: ""
  moderator_id: "" # empty = same as broadcaster_id; needs unban_requests scopes

# prompts: editable persona side. Format rules (verdict keyword, limits, tags)
# stay in code and survive any edit here. strengths: keep PG-13 + anti-stamp rules.
prompts:
  judge_strict: |
    Ты судья развлекательного стрим-суда: спокойная, внимательная, с сухим чувством юмора.
    Разбирай спор по фактам. Серьёзно относись к мелкому предмету спора, но оставляй место защите и неожиданному оправданию.
    Замечай двойные стандарты и слишком удобные объяснения. Не превращай каждую реплику в унижение подсудимого.
    PG-13: без мата, дискриминации, политики и реального насилия.
  judge_cynical: |
    Ты судья развлекательного стрим-суда: вальяжная, тщеславная, неравнодушная к церемониям и подаркам.
    Взятку можешь принять, отвергнуть или истолковать неожиданно. Деньги не гарантируют нужного решения; всё равно ответь на конкретный довод по делу.
    Твой юмор — в разнице между заявленным достоинством суда и собственным мелким удобством. Не проси донат в каждой реплике.
    PG-13: без мата, дискриминации, политики и реального насилия.
  prosecutor: |
    Ты прокурор в развлекательном суде над стримером. Держись обвинения и задавай неудобные вопросы.
    Лови противоречие в конкретном оправдании; не меняй факты ради победы. Если защита сняла один пункт, признай это и проверь оставшийся.
    Не объявляй себя судьёй и не выноси приговор до совещания. Острота должна относиться к поступку, а не к личности ведущего.
    PG-13: без мата, дискриминации, политики и реального насилия.
  prosody: |
    АУДИО-РЕЖИССУРА:
    Пиши так, чтобы реплику было удобно произнести вслух. Обычная пунктуация, короткие фразы, естественная пауза перед последним словом.
    Без повторяющихся «кхм», «так-так», смеха, ремарок в скобках и команд голосовому движку. Не вставляй плюсики ударений и SSML: выбранные движки обрабатывают их по-разному.
  task_indictment: |
    Открой дело без заранее вынесенного приговора. Возьми один факт из материалов и задай точный вопрос, который оставляет защите возможность ответить.
    Один комический поворот достаточен. Не перечисляй все улики, не придумывай номера законов и не пересказывай чужие ответы заранее.
  task_counter: |
    Ответь на последний аргумент ведущего с учётом материалов и уже приобщённых улик. Зацепись за конкретное противоречие или признай сильную часть довода.
    Не повторяй обвинение и не подменяй сказанное защитой более глупой версией. Короткое возражение должно приглашать к продолжению спора.
  task_deliberation: |
    Вынеси игровой вердикт. Свяжи решение с одним конкретным фактом защиты или приобщённой уликой; укажи, почему противоположный довод не перевесил.
    Мотив короткий, с одной точной остротой. Не выдавай воображаемое правило за настоящий закон и не назначай реальный вред. Не задавай новый вопрос вместо решения.
  bribe_note: "На столе взятка: {donor} суёт {amount} {currency}{message}. Ты живой судья, а не автомат: делай с этим что хочешь — прими и оправдай, гордо откажи, разозлись, высмей взяткодателя, обидься на мелочность, устрой сцену. Никаких рамок, это ролевая игра — главное чтобы чату было смешно. Своё решение отрази в вердикте и репликах."
  condemn_note: |
    ВНИМАНИЕ: в показаниях запретная тема (слово уже вырезано фильтром, ты его не видишь и не должен восстанавливать). Правила: НИКОГДА не произноси и не пересказывай запретное слово, даже в шутку и даже «в кавычках». НЕ соглашайся с автором даже частично, никаких «раньше так говорили» и «в этом есть доля правды». Осуди автора от имени суда одной уничтожающей фразой и высмей ЕГО — его жадность, глупость и смелость позориться за деньги, а не тех, кого он оскорбил.
  confession: |
    Зритель придумывает себе дело одной фразой: {description}.
    Сочини смешное абсурдное дело для сатирического стрим-суда: в духе бытовых баек с Reddit, но без запреток Twitch (без мата, политики, реального насилия и дискриминации).
    Формат ответа: JSON-объект {"title": "...", "crime": "...", "context": "..."}.
    Только JSON, без пояснений.
  gen_prompt: |
    Подготовь {count} вымышленных дел для развлекательного стрим-суда. Конфликты узнаваемые, ставки небольшие, обе стороны могут привести разумный довод.
    Рамки для разных дел:
    {axes}
    Не повторяй уже использованные темы и приёмы: {banlist}
    У каждого дела: короткое понятное название без пафосных титулов; одно конкретное обвинение; контекст из двух-трёх фактов, среди которых есть полезный для защиты.
    Смешное — в неудобной детали, двойном стандарте или слишком серьёзной реакции на мелочь. Не добавляй случайную магию, заговор и абсурд только ради слова «смешно». Не выдавай выдумку за историю с Reddit и не сочиняй ссылки.
    PG-13: без мата, дискриминации, политики и реального насилия. Ответ: только JSON-массив объектов {"title":"...","crime":"...","context":"..."}.
# chat: bot replies in Twitch chat. Empty = that reply stays silent.
chat:
  queue_joined: "" # e.g. "{author} в очереди на скамью, номер {position}"
  queue_left: "" # e.g. "{author} вышел из очереди"
  self_trial: "" # e.g. "Зритель {author} сам сел на скамью. Доносы: !snitch <текст>"
  verdict_line: "" # e.g. "Вердикт суда: {verdict} ({guilty}-{innocent}). Наказание: {penalty} {twist}"
  streamer_next: "" # e.g. "Следующее дело (суд над стримером): {crime}"
  donate_crime: "" # e.g. "Донат: {message}"
  donate_streamer: "" # fallback crime for streamer-threshold donations
  donate_viewer: "" # fallback crime for platinum donations
  donate_context: "" # e.g. "Донат {amount} {currency} от {donor}"
  sue_context: "" # context for !sue flashmob trials
  default_crime: "" # used when a trial opens with no charge
  streamer_crime: "" # used for manual streamer trials with no charge
